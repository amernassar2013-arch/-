<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>اكتشف الأردن</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="planner">
    <div id="hdr"></div>

    <main class="wrap pg">
      <h1 data-i="pt"></h1>
      <p class="sub" data-i="pi"></p>
      <div class="grid" id="ints"></div>

      <div class="bar">
        <label>
          <span data-i="days"></span>
          <input id="nd" type="number" min="1" max="7" value="3" />
        </label>
        <label>
          <span data-i="city"></span>
          <select id="ct">
            <option value="amman" data-i="amman"></option>
            <option value="aqaba" data-i="aqaba"></option>
            <option value="petra" data-i="petra"></option>
            <option value="dead-sea" data-i="deadsea"></option>
            <option value="irbid" data-i="irbid"></option>
            <option value="madaba" data-i="madaba"></option>
          </select>
        </label>
        <button class="gold" id="go" data-i="go"></button>
      </div>

      <div id="res"></div>
    </main>

    <div id="ftr"></div>
    <script src="js/app.js"></script>
  </body>
</html>
